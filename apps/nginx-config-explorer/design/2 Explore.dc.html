var PREFIX = '/etc/nginx/';
var BLOCK_NAMES = { http: 1, server: 1, location: 1, upstream: 1, events: 1, types: 1, map: 1, 'if': 1, geo: 1, limit_except: 1, stream: 1, mail: 1 };
var C = {
  ink: '#14181B', muted: '#5B6469', block: '#16794A', dir: '#1D4FB8', str: '#9A4A00',
  vari: '#7B3BB5', num: '#0F6E78', cmt: '#6A7176', regex: '#B0306A'
};

function splitFiles(text) {
  var lines = text.split(/\r?\n/);
  var files = [];
  var cur = null;
  for (var i = 0; i < lines.length; i++) {
    var m = /^# configuration file (.+):$/.exec(lines[i]);
    if (m) { cur = { path: m[1], lines: [] }; files.push(cur); continue; }
    if (cur) cur.lines.push(lines[i]);
  }
  return files;
}

function parseFile(file) {
  var root = [];
  var stack = [root];
  var words = [];
  var startLine = 0;
  var src = file.lines;
  for (var ln = 0; ln < src.length; ln++) {
    var s = src[ln];
    var i = 0;
    while (i < s.length) {
      var ch = s[i];
      if (ch === ' ' || ch === '\t') { i++; continue; }
      if (ch === '#') {
        if (words.length === 0) stack[stack.length - 1].push({ type: 'comment', text: s.slice(i), line: ln + 1, file: file.path });
        i = s.length; continue;
      }
      if (ch === ';' || ch === '{') {
        var node = { type: ch === '{' ? 'block' : 'dir', name: words[0] || '', args: words.slice(1), line: startLine, file: file.path, children: [] };
        stack[stack.length - 1].push(node);
        if (ch === '{') stack.push(node.children);
        words = []; i++; continue;
      }
      if (ch === '}') { if (stack.length > 1) stack.pop(); i++; continue; }
      if (words.length === 0) startLine = ln + 1;
      var j = i;
      if (ch === '"' || ch === "'") {
        j = i + 1;
        while (j < s.length && s[j] !== ch) { if (s[j] === '\\') j++; j++; }
        j++;
      } else {
        while (j < s.length && ' \t;{}'.indexOf(s[j]) < 0) j++;
      }
      words.push(s.slice(i, j));
      i = j;
    }
  }
  return root;
}

function globToRe(p) {
  var full = p.charAt(0) === '/' ? p : PREFIX + p;
  var re = full.replace(/[.+^${}()|\\]/g, '\\$&').replace(/\*/g, '[^/]*').replace(/\?/g, '[^/]');
  return new RegExp('^' + re + '$');
}

function countLeaves(nodes) {
  var n = 0;
  for (var i = 0; i < nodes.length; i++) {
    var c = nodes[i];
    if (c.type === 'comment') continue;
    n += 1;
    if (c.children && c.children.length) n += countLeaves(c.children);
  }
  return n;
}

function firstArg(nodes, name) {
  for (var i = 0; i < nodes.length; i++) if (nodes[i].name === name) return nodes[i].args.join(' ');
  return '';
}

function summarize(node) {
  if (node.type === 'file') return countLeaves(node.children) + ' directives';
  if (node.type === 'include') return node.children.length ? node.children.length + (node.children.length === 1 ? ' file' : ' files') : '';
  var kids = node.children.filter(function (c) { return c.type !== 'comment'; });
  if (node.name === 'server' && node.parentName !== 'upstream') {
    var parts = [];
    var listen = firstArg(kids, 'listen');
    var names = firstArg(kids, 'server_name');
    if (listen) parts.push('listen ' + listen);
    if (names) parts.push(names);
    var locs = kids.filter(function (c) { return c.name === 'location'; }).length;
    if (locs) parts.push(locs + (locs === 1 ? ' location' : ' locations'));
    return parts.join(' · ');
  }
  if (node.name === 'upstream') {
    var srv = kids.filter(function (c) { return c.name === 'server'; }).length;
    return srv + (srv === 1 ? ' server' : ' servers');
  }
  if (node.name === 'types') return kids.length + ' mime types';
  return countLeaves(node.children) + (countLeaves(node.children) === 1 ? ' directive' : ' directives');
}

function build(files, merged) {
  var parsed = {};
  files.forEach(function (f) { parsed[f.path] = parseFile(f); });
  var paths = files.map(function (f) { return f.path; });

  function decorate(nodes, parentId, parentName, seen) {
    return nodes.map(function (n, i) {
      var id = parentId + '.' + i;
      var out = { id: id, type: n.type, name: n.name, args: n.args, text: n.text, line: n.line, file: n.file, parentName: parentName, children: [] };

    });
  }

  if (merged) {
    var main = paths[0];
    return decorate(parsed[main], 'm', '', [main]);
  }
  return paths.map(function (p, k) {
    var fid = 'f' + k;
    return { id: fid, type: 'file', name: p, args: [], line: 0, file: p, children: decorate(parsed[p], fid, '', [p]) };
  });
}

function argStyle(a) {
  if (/^["']/.test(a)) return C.str;
  if (a.indexOf('$') >= 0) return C.vari;
  if (/^(on|off|all|always)$/.test(a)) return C.num;
  if (/^~\*?$|^=$|^\^~$/.test(a)) return C.regex;
  if (/^[0-9.]+[a-z]*$/i.test(a)) return C.num;
  return C.ink;
}

function isContainer(n) { return n.type === 'block' || n.type === 'include' || n.type === 'file'; }

function walkAll(nodes, fn, ancestors) {
  nodes.forEach(function (n) {
    fn(n, ancestors);
    if (n.children && n.children.length) walkAll(n.children, fn, ancestors.concat([n.id]));
  });
}

function nodeText(n) {
  if (n.type === 'comment') return n.text;
  return (n.name + ' ' + n.args.join(' ')).trim();
}

function openToLevel(tree, level) {
  var open = {};
  walkAll(tree, function (n, anc) {
    if (isContainer(n) && anc.length < level) open[n.id] = true;
  }, []);
  return open;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    var files = splitFiles(DUMP);
    var merged = build(files, true);
    var byFile = build(files, false);
    var lvl = Number(props.startLevel ?? 2);
    this.files = files;
    this.trees = { merged: merged, files: byFile };
    this.state = {
      view: 'merged', level: lvl, open: openToLevel(merged, lvl),
      comments: true, query: '', matchIdx: 0, focus: ''
    };
  }

  setView(view) {
    var lvl = this.state.level;
    this.setState({ view: view, open: openToLevel(this.trees[view], view === 'files' ? lvl - 1 : lvl), focus: '', matchIdx: 0 });
  }

  renderVals() {
    var self = this;
    var st = this.state;
    var accent = this.props.accent ?? '#16794A';
    var tree = this.trees[st.view];
    var q = st.query.trim().toLowerCase();

    var matches = [];
    var forced = {};
    if (q) {
      walkAll(tree, function (n, anc) {
        if (n.type === 'comment' && !st.comments) return;
        if (nodeText(n).toLowerCase().indexOf(q) >= 0) {
          matches.push(n.id);
          anc.forEach(function (a) { forced[a] = true; });
        }
      }, []);
    }
    var idx = matches.length ? ((st.matchIdx % matches.length) + matches.length) % matches.length : 0;
    var current = matches.length ? matches[idx] : '';
    var matchSet = {};
    matches.forEach(function (m) { matchSet[m] = true; });

    function toggle(id) {
      return function () {
        var o = Object.assign({}, self.state.open);
        if (o[id]) delete o[id]; else o[id] = true;
        self.setState({ open: o, focus: '' });
      };
    }

    function hl(text, color, extra) {
      var base = 'color: ' + color + ';' + (extra || '');
      if (!q) return [{ text: text, style: base }];
      var out = [];
      var low = text.toLowerCase();
      var at = 0;
      var k = low.indexOf(q);
      while (k >= 0) {
        if (k > at) out.push({ text: text.slice(at, k), style: base });
        out.push({ text: text.slice(k, k + q.length), style: base + ' background: #FFD25E; border-radius: 2px' });
        at = k + q.length;
        k = low.indexOf(q, at);
      }
      if (at < text.length) out.push({ text: text.slice(at), style: base });
      return out;
    }

    var rows = [];
    function pushRows(nodes, depth) {
      nodes.forEach(function (n) {
        if (n.type === 'comment' && !st.comments) return;
        var container = isContainer(n) && (n.children.length > 0);
        var open = container && (!!st.open[n.id] || !!forced[n.id]);
        var segs = [];
        if (n.type === 'comment') {
          segs = hl(n.text, C.cmt, ' font-style: italic;');
        } else if (n.type === 'file') {
          segs = hl(n.name, C.ink, ' font-weight: 700;');
        } else {
          var nameColor = n.type === 'block' && BLOCK_NAMES[n.name] ? C.block : C.dir;
          segs = hl(n.name, nameColor, n.type === 'block' ? ' font-weight: 700;' : '');
          n.args.forEach(function (a) {
            segs.push({ text: ' ', style: '' });
            segs = segs.concat(hl(a, argStyle(a), ''));
          });
          if (n.type === 'block') segs.push({ text: ' {', style: 'color: ' + C.muted });
          else segs.push({ text: ';', style: 'color: ' + C.muted });
        }
        var isMatch = !!matchSet[n.id];
        var isCurrent = n.id === current || n.id === st.focus;
        var bg = isCurrent ? '#FFF1C2' : (isMatch ? '#FFF8E0' : (n.type === 'file' ? '#F5F8F6' : 'transparent'));
        var bar = isCurrent ? accent : 'transparent';
        var badge = '';
        var badgeStyle = '';
        if (n.type === 'include' && n.missing) {
          badge = 'not in dump';
          badgeStyle = 'flex: none; margin-left: 12px; font-family: \'IBM Plex Sans\', system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #8A3B00; background: #FDEBD8; border-radius: 999px; padding: 3px 9px';
        } else if (st.view === 'merged' && n.type === 'file') {
          badge = 'included';
          badgeStyle = 'flex: none; margin-left: 12px; font-family: \'IBM Plex Sans\', system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #0F5A36; background: #E3F1E9; border-radius: 999px; padding: 3px 9px';
        }
        var summary = container && !open ? summarize(n) : (n.type === 'file' && open ? summarize(n) : '');
        rows.push({
          segs: segs,
          line: n.type === 'file' ? '' : String(n.line),
          where: n.type === 'file' ? n.name : n.file + ':' + n.line,
          rowStyle: 'display: flex; align-items: center; min-height: 28px; padding-right: 16px; background: ' + bg + '; box-shadow: inset 3px 0 0 ' + bar + ';' + (n.type === 'file' ? ' border-top: 1px solid #E6EBE8; margin-top: 4px;' : ''),
          indentStyle: 'flex: none; width: ' + (depth * 22) + 'px; align-self: stretch; background-image: repeating-linear-gradient(to right, #E1E6E3 0 1px, transparent 1px 22px); background-position: 10px 0;',
          hasCaret: container,
          noCaret: !container,
          isFile: n.type === 'file',
          open: open ? 'true' : 'false',
          toggle: toggle(n.id),
          toggleLabel: (open ? 'Collapse ' : 'Expand ') + nodeText(n),
          caretStyle: 'transition: transform 120ms; transform: rotate(' + (open ? 90 : 0) + 'deg)',
          collapsed: container && !open && n.type === 'block',
          ellipsis: '… }',
          hasSummary: !!summary,
          summary: summary,
          hasBadge: !!badge,
          badge: badge,
          badgeStyle: badgeStyle
        });
        if (open) {
          pushRows(n.children, depth + 1);
          if (n.type === 'block') {
            rows.push({
              segs: [{ text: '}', style: 'color: ' + C.muted }],
              line: '', where: n.file, rowStyle: 'display: flex; align-items: center; min-height: 24px; padding-right: 16px',
              indentStyle: 'flex: none; width: ' + (depth * 22) + 'px; align-self: stretch; background-image: repeating-linear-gradient(to right, #E1E6E3 0 1px, transparent 1px 22px); background-position: 10px 0;',
              hasCaret: false, noCaret: true, isFile: false, collapsed: false, hasSummary: false, hasBadge: false
            });
          }
        }
      });
    }
    pushRows(tree, 0);

    var outline = [];
    function jumpTo(id, anc) {
      return function () {
        var o = Object.assign({}, self.state.open);
        anc.forEach(function (a) { o[a] = true; });
        self.setState({ open: o, focus: id });
      };
    }
    var outlineStyle = function (id) {
      var on = id === st.focus;
      return 'display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 48px; padding: 6px 8px; border: none; border-radius: 8px; cursor: pointer; font: inherit; background: ' + (on ? '#E3F1E9' : 'transparent') + '; box-shadow: inset 3px 0 0 ' + (on ? accent : 'transparent');
    };
    if (st.view === 'merged') {
      walkAll(tree, function (n, anc) {
        if (n.type !== 'block') return;
        if (n.name === 'server' && n.parentName !== 'upstream') {
          var kids = n.children;
          outline.push({ label: firstArg(kids, 'server_name').split(' ')[0] || '(no server_name)', sub: 'listen ' + firstArg(kids, 'listen') + ' · ' + n.file.replace(PREFIX, ''), kind: 'server', jump: jumpTo(n.id, anc), style: outlineStyle(n.id) });
        } else if (n.name === 'upstream') {
          outline.push({ label: n.args.join(' '), sub: summarize(n), kind: 'upstream', jump: jumpTo(n.id, anc), style: outlineStyle(n.id) });
        }
      }, []);
    } else {
      tree.forEach(function (f) {
        outline.push({ label: f.name.replace(PREFIX, ''), sub: summarize(f), kind: 'file', jump: jumpTo(f.id, []), style: outlineStyle(f.id) });
      });
    }

    var totalLines = this.files.reduce(function (s, f) { return s + f.lines.length; }, 0);
    var tabBase = 'min-height: 32px; padding: 0 14px; border: none; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ';
    var on = tabBase + 'background: #FFFFFF; color: #14181B; box-shadow: 0 1px 2px rgba(20,24,27,0.12)';
    var off = tabBase + 'background: transparent; color: #3F474C';
    var lvlStyle = function (n) {
      var active = n === st.level;
      return 'width: 32px; height: 32px; border-radius: 7px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid ' + (active ? accent : '#C5CEC9') + '; background: ' + (active ? accent : '#FFFFFF') + '; color: ' + (active ? '#FFFFFF' : '#14181B');
    };

    return {
      accent: accent,
      stats: this.files.length + ' files · ' + totalLines + ' lines',
      setMerged: function () { self.setView('merged'); },
      setFiles: function () { self.setView('files'); },
      mergedPressed: st.view === 'merged' ? 'true' : 'false',
      filesPressed: st.view === 'files' ? 'true' : 'false',
      mergedTabStyle: st.view === 'merged' ? on : off,
      filesTabStyle: st.view === 'files' ? on : off,
      expandAll: function () { self.setState({ open: openToLevel(tree, 99), level: 0 }); },
      collapseAll: function () { self.setState({ open: {}, level: 0, focus: '' }); },
      levels: [1, 2, 3].map(function (n) {
        return { n: n, label: 'Expand to level ' + n, style: lvlStyle(n), pick: function () { self.setState({ level: n, open: openToLevel(tree, st.view === 'files' ? n : n), focus: '' }); } };
      }),
      showComments: st.comments,
      toggleComments: function () { self.setState({ comments: !self.state.comments }); },
      query: st.query,
      onQuery: function (e) { self.setState({ query: e.target.value, matchIdx: 0, focus: '' }); },
      matchLabel: q ? (matches.length ? (idx + 1) + ' of ' + matches.length : 'no matches') : '',
      prevMatch: function () { self.setState({ matchIdx: self.state.matchIdx - 1 }); },
      nextMatch: function () { self.setState({ matchIdx: self.state.matchIdx + 1 }); },
      outlineTitle: st.view === 'merged' ? 'Servers & upstreams' : 'Files in this dump',
      outline: outline,
      treeCaption: st.view === 'merged' ? 'Starting at /etc/nginx/nginx.conf, every include opened where nginx reads it' : 'Each file as nginx -T printed it',
      rows: rows
    };
  }
}
</script>
</body>
</html>
