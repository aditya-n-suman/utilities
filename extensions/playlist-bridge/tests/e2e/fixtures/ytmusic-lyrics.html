<!doctype html>
<!-- Stand-in for YouTube Music's lyrics tab, with the elements the lyrics bar looks for (checked on the real site,
     Chrome 138, 2026-10). Lyrics: "Yun Zindagi Ki Raah Mein" (Urdu), first lines only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Music</title>
<style>
  body{margin:0;background:#030303;color:#fff;font-family:Roboto,Arial,sans-serif}
  ytmusic-player-page{display:block;max-width:640px;margin:0 auto;padding:32px 24px}
  ytmusic-description-shelf-renderer{display:block}
  .description{display:block;white-space:pre-wrap;font-size:16px;line-height:1.6;color:#fff}
  .footer{display:block;margin-top:24px;font-size:14px;color:#aaa}
</style>
</head>
<body>
<ytmusic-app>
  <ytmusic-player-page>
    <!-- Another tab's shelf (artist bio in "Related"), hidden and first in the DOM: the bar must skip it. -->
    <div hidden>
      <ytmusic-description-shelf-renderer>
        <yt-formatted-string class="description style-scope ytmusic-description-shelf-renderer">An artist biography.</yt-formatted-string>
      </ytmusic-description-shelf-renderer>
    </div>
    <ytmusic-description-shelf-renderer>
      <yt-formatted-string class="non-expandable description style-scope ytmusic-description-shelf-renderer">یوں زندگی کی راہ میں ٹکرا گیا کوئی
یوں زندگی کی راہ میں ٹکرا گیا کوئی

اک روشنی اندھیروں میں بکھرا گیا کوئی</yt-formatted-string>
      <yt-formatted-string class="footer style-scope ytmusic-description-shelf-renderer">Source: Musixmatch</yt-formatted-string>
    </ytmusic-description-shelf-renderer>
  </ytmusic-player-page>
</ytmusic-app>
</body>
</html>
