# Publishes a Playlist Bridge release when a tag like playlist-bridge-v1.2.0 is pushed.
# The tag must match extensions/playlist-bridge/package.json. See extensions/playlist-bridge/SETUP.md → Release.
name: playlist-bridge release

on:
  push:
    tags: ["playlist-bridge-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/playlist-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/playlist-bridge/package-lock.json

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "playlist-bridge-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Install or update:** follow [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/extensions/playlist-bridge/INSTALL.md).

          - **Chrome, Edge, Brave:** download \`playlist-bridge-extension-${VERSION}-chrome.zip\`.
            Already installed? Replace the files in your Playlist Bridge folder with the new ones, then click ↻ on the extensions page.
          - **Firefox:** use the signed \`.xpi\` if one is attached. The Firefox zip is the unsigned build for signing.

          SHA-256 checksums are in \`SHA256SUMS.txt\`.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "Playlist Bridge ${VERSION}" \
            --notes-file notes.md \
            .output/playlist-bridge-extension-${VERSION}-chrome.zip \
            .output/playlist-bridge-extension-${VERSION}-firefox.zip \
            .output/playlist-bridge-extension-${VERSION}-sources.zip \
            .output/SHA256SUMS.txt
